name: decembre
services:
  db:
    image: postgres:16-alpine
    env_file: [.env.docker]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: always

  backend:
    build: ./backend_django
    expose:
      - "3001"
    env_file: [.env.docker]
    environment:
      POSTGRES_HOST: db
      BRVM_DATA_DIR: /data/brvm_data
      UPLOAD_DIR: /data/uploads
    volumes:
      - ./data/brvm_data:/data/brvm_data:ro
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db-backup:
    # pg_dump quotidien + rotation, prêt à l'emploi -- pas de script cron
    # maison à écrire/maintenir pour ça.
    image: prodrigestivill/postgres-backup-local:16-alpine
    env_file: [.env.docker]
    environment:
      POSTGRES_HOST: db
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "3001:3001"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always

  admin:
    build: ./admin
    ports:
      - "3000:8080"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
