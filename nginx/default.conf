# Seule porte d'entree de l'API (port 3001). Le backend n'est plus publie.

# Journal sans query string : /uploads?token=<jwt> ne doit pas finir dans les logs.
log_format sans_query '$remote_addr "$request_method $uri" $status $body_bytes_sent';

server {
    listen 3001;
    access_log /var/log/nginx/access.log sans_query;
    client_max_body_size 25m;   # photos KYC: 15 Mo max cote API, +1/3 en base64

    # Derriere ngrok ou Docker Desktop, le pair direct est une adresse privee :
    # on lit alors l'IP reelle dans X-Forwarded-For. Un pair public (production)
    # n'est pas dans ces plages, donc son en-tete est ignore.
    # shortcut: en local un client du reseau Docker peut forger son IP ; en
    # production, remplacer par l'IP exacte du load balancer.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        proxy_pass http://backend:3001;
        # Host fixe : Django n'accepte que "backend" (ALLOWED_HOSTS).
        proxy_set_header Host backend;
        # Ecrase l'en-tete client : $remote_addr est deja l'IP reelle (realip).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
