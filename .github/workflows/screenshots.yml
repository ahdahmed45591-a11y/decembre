name: App Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Build web
      working-directory: deel_wallet_app
      run: |
        flutter create --platforms=web --project-name deel_wallet .
        flutter pub get
        flutter build web --release

    - name: Capture
      run: |
        pip install playwright
        playwright install --with-deps chromium
        (cd deel_wallet_app/build/web && python3 -m http.server 8080 >/dev/null 2>&1 &)
        sleep 3
        mkdir -p /tmp/shots
        python3 .github/screenshots/shots.py /tmp/shots

    - name: Telecharger les captures (onglet Artifacts du run)
      uses: actions/upload-artifact@v4
      with:
        name: captures-app
        path: /tmp/shots/*.png
        retention-days: 3

    - name: Publier les captures dans le depot
      continue-on-error: true
      run: |
        git config user.name "github-actions"
        git config user.email "actions@users.noreply.github.com"
        mkdir -p screenshots
        cp /tmp/shots/*.png screenshots/
        git add screenshots
        git commit -qm "Captures de l'application"
        git pull -q --rebase origin main
        git push origin HEAD:main
